# Drive the BOTTOM nav (the TabContainer's own tab strip is hidden via
# tabs_visible=false; navigation is the bottom-nav buttons). Tap each
# primary destination in turn and screenshot the resulting content.
#
# v0.15.11 nav order: Catch · Bestiary · Shop · Battle · More — 5 buttons
# evenly across the device width at the very bottom (~96% height). Each
# button is ~20% wide, so centers at 10%, 30%, 50%, 70%, 90%.
#
# (Pre-v0.15.11 this flow tapped the top of the screen at y=5%, a
# leftover from when the TabContainer's strip was visible; with the
# strip hidden those taps did nothing. Rewritten to the real bottom nav.)
#
# No text/id selectors: Godot renders to a single surface, so Maestro
# can't see widget text — coordinate taps are the only option. There are
# no assertions; the screenshots are the visual-regression artifact.
appId: com.divora.beast
---
- launchApp:
    appId: com.divora.beast
    clearState: true
- waitForAnimationToEnd:
    timeout: 5000

# Dismiss the first-launch Peniber intro overlay (4 beats; tap to advance).
- repeat:
    times: 6
    commands:
      - tapOn:
          point: "50%, 60%"
      - waitForAnimationToEnd
- takeScreenshot: 02_after_intro

- tapOn:
    point: "10%, 96%"    # Catch
- waitForAnimationToEnd
- takeScreenshot: 02_nav_catch

- tapOn:
    point: "30%, 96%"    # Bestiary
- waitForAnimationToEnd
- takeScreenshot: 02_nav_bestiary

- tapOn:
    point: "50%, 96%"    # Shop
- waitForAnimationToEnd
- takeScreenshot: 02_nav_shop

- tapOn:
    point: "70%, 96%"    # Battle
- waitForAnimationToEnd
- takeScreenshot: 02_nav_battle
