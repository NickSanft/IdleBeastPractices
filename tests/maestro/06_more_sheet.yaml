# Tap the "More" button (rightmost in the v0.9.0 bottom nav), screenshot
# the popup that opens, tap one of the secondary destinations (Shop is
# the first item in the More sheet), screenshot the result.
#
# Catches:
#  - More popup fails to open (handler unwired, popup never built)
#  - Popup renders empty (secondary destinations not added)
#  - Tapping a secondary destination doesn't switch tabs (wiring
#    regression in _on_more_item_selected)
#
# v0.9.0 nav layout: bottom nav has 5 buttons across the device width
# at ~95% of the height. More is at index 4 → x ≈ 90%.
appId: com.divora.beast
---
- launchApp:
    appId: com.divora.beast
    clearState: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "90%, 95%"     # More button (rightmost in bottom nav)
- waitForAnimationToEnd
- takeScreenshot: 06_more_sheet_open

# v0.9.1 More sheet sits as a bottom-sheet popup just above the nav.
# Shop is the first secondary destination — it sits a few rows up
# inside the popup. Tapping at ~80% height lands on the popup's
# Shop row. (If the calibration drifts, scroll the screenshot output
# and adjust the y-percentage.)
- tapOn:
    point: "50%, 80%"
- waitForAnimationToEnd
- takeScreenshot: 06_after_shop_tap
